<SCRIPT LANGUAGE="JSCRIPT">

function InitDocument(document)
{
	setDirection();
	
	if (window.external.FindSymbol("DOCUMENT_FIRST_LOAD"))
	{
		/*
		if("true" == window.external.FindSymbol("CONSOLE_TYPE_ONLY"))
		{
			window.external.AddSymbol("CONSOLE_APP", true);
			window.external.AddSymbol("WIN_APP", false);
		}
		*/
		var L_WizardDialogTitle_Text = "Win32 智能设备项目向导";
		window.external.AddSymbol("WIZARD_DIALOG_TITLE", L_WizardDialogTitle_Text);
		var strProjName = window.external.FindSymbol("PROJECT_NAME");
		var coll = document.all.tags("SYMBOL");
		var numSymbols = coll.length;
		for (i = 0; i < numSymbols; i++)
		{
			var obj = coll(i);
			if (typeof(obj.VALUE) == "undefined")
			{
				obj.VALUE = getval(obj, strProjName);
			}
		}
		SetLocaleForResources(window.external.GetHostLocale());
		window.external.SetDefaults(document);
	}
	window.external.Load(document);
	InitControls();
}

function InitControls()
{
	var L_APPTYPEWIN_TEXT = "Windows 应用程序";
	var L_APPTYPEDLL_TEXT = "动态链接库(DLL)";
	var L_APPTYPECON_TEXT = "控制台应用程序";
	var L_APPTYPELIB_TEXT = "静态库";

	if (window.external.FindSymbol("DLL_APP"))
		APPTYPE.innerText = L_APPTYPEDLL_TEXT;
	else
	{
		if (window.external.FindSymbol("CONSOLE_APP"))
			APPTYPE.innerText = L_APPTYPECON_TEXT;
		else
		{
			if (window.external.FindSymbol("LIB_APP"))
				APPTYPE.innerText = L_APPTYPELIB_TEXT;
			else
				APPTYPE.innerText = L_APPTYPEWIN_TEXT;
		}
	}

	ATLSUPP.parentNode.style.display = 'none';
	MFCSUPP.parentNode.style.display = 'none';
	if (window.external.FindSymbol("SUPPORT_ATL") && !window.external.IsSymbolDisabled("SUPPORT_ATL"))
	{
		var L_ATLSUPP_TEXT = "ATL 支持";
		ATLSUPP.innerText = L_ATLSUPP_TEXT;
		ATLSUPP.parentNode.style.display = 'block';
	}
	if (window.external.FindSymbol("SUPPORT_MFC") && !window.external.IsSymbolDisabled("SUPPORT_MFC"))
	{
		var L_MFCSUPP_TEXT = "MFC 支持";
		MFCSUPP.innerText = L_MFCSUPP_TEXT;
		MFCSUPP.parentNode.style.display = 'block';
	}

	try 
	{
		var L_PLATFORM_Text = "平台";
		var L_TARGETPLATFORMS_Text = "";
	
		var checkedPlatforms = new Array(); 
		checkedPlatforms = window.external.FindSymbol("CHECKED_PLATFORMS");

		if (checkedPlatforms.length)
		{		
			for (i = 0 ; i < checkedPlatforms.length ; i++)
			{
				L_TARGETPLATFORMS_Text += checkedPlatforms[i];
                                L_TARGETPLATFORMS_Text += " ";
                                L_TARGETPLATFORMS_Text += L_PLATFORM_Text;
				if (i < checkedPlatforms.length - 1)
				{
					L_TARGETPLATFORMS_Text += ", ";
				}	
			}
		}
		else
		{
			ProjWiz.GetBaseNativePlatforms();
			L_TARGETPLATFORMS_Text += ProjWiz.GetBaseNativePlatform(0);
			L_TARGETPLATFORMS_Text += " ";
			L_TARGETPLATFORMS_Text += L_PLATFORM_Text;

			checkedPlatforms = new Array();
			checkedPlatforms[0] =  ProjWiz.GetBaseNativePlatform(0);

			window.external.AddSymbol("CHECKED_PLATFORMS", checkedPlatforms);
		}
		TARGET_PLATFORMS.innerText = L_TARGETPLATFORMS_Text;

 		var nativePlatforms = new Array();
 		nativePlatforms = window.external.FindSymbol("NATIVE_PLATFORMS");
 		if (nativePlatforms.length)
 		{
 			;	// do nothing, assume it's already got loaded...
 		}
 		else
 		{
			nativePlatforms = new Array();
			for (i = 0, nPlatform = 0 ; i < checkedPlatforms.length ; i++)
			{
				var nInstructionSets = ProjWiz.GetInstructionSetsForBaseNativePlatform(checkedPlatforms[i]);
				for (j = 0 ; j < nInstructionSets ; j++)
				{
					nativePlatforms[nPlatform++] = ProjWiz.GetNativePlatformName(checkedPlatforms[i], ProjWiz.GetInstructionSetForBaseNativePlatform(checkedPlatforms[i], j));
				}
			}
			window.external.AddSymbol("NATIVE_PLATFORMS", nativePlatforms);
		}
	}
	catch (e)
	{
		window.external.Finish(document, 'cancel');
	}
}

function Next(document, linkto)
{
	window.external.Next(document, linkto);
}

function OnFinish(document)
{
	OnWizFinish(document);
}

function getval(obj, strProjName)
{
	var SymbolValue = "";
	switch(obj.NAME)
	{
		case "SAFE_PROJECT_IDENTIFIER_NAME":
			SymbolValue	= CreateIdentifierSafeName(strProjName);
			break;
		case "UPPER_CASE_SAFE_PROJECT_IDENTIFIER_NAME":
			{
				var strSafeProjName = CreateSafeName(strProjName);
				SymbolValue = strSafeProjName.toUpperCase();
			}
			break;
		case  "YEAR":
			{
				d = new Date();
				SymbolValue = d.getFullYear().toString();
			}
			break;
		default:
			SymbolValue = "";
			break;
	}
	return (SymbolValue);
}
