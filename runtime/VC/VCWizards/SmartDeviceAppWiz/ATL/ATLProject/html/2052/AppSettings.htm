<SCRIPT LANGUAGE="JSCRIPT">

var tab_array = new Array();
tab_array[0] = Default;
tab_array[1] = Platforms;
tab_array[2] = AppSettings;

function InitDocument(document)
{
	setDirection();
	window.external.Load(document);
	InitControls();
}

function Next(document, linkto)
{
	window.external.Next(document, linkto);
}

function OnFinish(document)
{
	OnWizFinish(document);
}

function InitControls()
{
	SUPPORT_MFC.disabled = true;
	SUPPORT_MFC_LABEL.disabled = true;
	SUPPORT_PROXY_STUB.disabled = true;
	SUPPORT_PROXY_STUB_LABEL.disabled = true;

	if (DLL_APP.checked)
	{
		SUPPORT_MFC.disabled = false;
		SUPPORT_MFC_LABEL.disabled = false;
		SUPPORT_PROXY_STUB.disabled = false;
		SUPPORT_PROXY_STUB_LABEL.disabled = false;
	}
	else if (EXE_APP.checked) 
	{
		SUPPORT_MFC.checked = false;
		SUPPORT_PROXY_STUB.checked = false;
	}

	ToggleImage();
}

function ToggleImage()
{
	DLL_APP_IMAGE.style.display = "none";
	EXE_APP_IMAGE.style.display = "none";

	if (DLL_APP.checked)
	{
		DLL_APP_IMAGE.style.display = "block";
		return;
	}
	if (EXE_APP.checked)
	{
		EXE_APP_IMAGE.style.display = "block";
		return;
	}
}

function OnSupportProxyStubChange()
{
	// if SUPPORT_PROXY_STUB is set, also set MERGE_PROXY_STUB
	if (SUPPORT_PROXY_STUB.checked)
	{
		window.external.AddSymbol("MERGE_PROXY_STUB", true);
	}
	else
	{
		window.external.AddSymbol("MERGE_PROXY_STUB", false);
	}

}

</SCRIPT>
