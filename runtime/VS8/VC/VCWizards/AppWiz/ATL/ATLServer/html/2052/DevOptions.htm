<SCRIPT LANGUAGE="JSCRIPT">

var tab_array = new Array();
tab_array[0] = Default;
tab_array[1] = AppSettings;
tab_array[2] = ServerOptions;
tab_array[3] = AppOptions;
tab_array[4] = DevOptions;

function InitDocument(document)
{
	setDirection();
	InitTabs();
	window.external.Load(document);
	InitControls();
	TODO.focus();
}

function InitControls()
{
	ATTRIBUTED.checked = window.external.FindSymbol("ATTRIBUTED");
	
	if (window.external.FindSymbol("SOAP"))
		ATTRIBUTED.disabled = true;
		
	else
		ATTRIBUTED.disabled = false;
	TODO.checked = window.external.FindSymbol("TODO");
	WEBDBG.checked = window.external.FindSymbol("WEBDBG");
	attributed_title.disabled = ATTRIBUTED.disabled;
}

function InitTabs()
{
	MouseOut(ServerOptions);
	MouseOut(AppOptions);
}

function Next(document, linkto)
{
	window.external.Next(document, linkto);
}

function OnFinish(document)
{
	OnWizFinish(document);
}

function onClick(obj)
{
	if (obj.id == "ServerOptions")
	{
		if (window.external.FindSymbol("GENERATE_ISAPI") || 
			window.external.FindSymbol("COMBINE_PROJECTS")) 
		{ 
			Next(document, "ServerOptions.htm"); 
		}
	}
	else if (obj.id == "AppOptions")
	{
		if (window.external.FindSymbol("GENERATE_APP") || 
			window.external.FindSymbol("COMBINE_PROJECTS")) 
		{
			Next(document, "AppOptions.htm");
		}
	}
}

function OnTodo()
{
	window.external.AddSymbol("TODO", TODO.checked);
}

function OnWebDbg()
{
	window.external.AddSymbol("WEBDBG", WEBDBG.checked);
}

function OnAttributed()
{
	window.external.AddSymbol("ATTRIBUTED", ATTRIBUTED.checked);
}

</SCRIPT>
