<SCRIPT LANGUAGE="JSCRIPT">

var tab_array = new Array();
tab_array[0] = Default;
tab_array[1] = AppSettings;
tab_array[2] = Notifications;

function InitDocument(document)
{
	setDirection();
	
	if (window.external.FindSymbol("DOCUMENT_FIRST_LOAD"))
	{
		var L_WizardDialogTitle_Text = "ISAPI 扩展向导";
		window.external.AddSymbol("WIZARD_DIALOG_TITLE", L_WizardDialogTitle_Text);
		var strProjName = window.external.FindSymbol("PROJECT_NAME");
		var coll = document.all.tags("SYMBOL");
		var numSymbols = coll.length;
		for (i = 0; i < numSymbols; i++)
		{
			var obj = coll(i);
			if (typeof(obj.VALUE) == "undefined")
			{
				obj.VALUE = getval(obj, strProjName);
			}
		}
		SetLocaleForResources(window.external.GetHostLocale());
		window.external.SetDefaults(document);
	}
	InitTabs();
	window.external.Load(document);
	InitControls();
}

function InitTabs()
{
	MouseOut(Notifications);
}

function InitControls()
{
	GENSERVEREXT.parentNode.style.display = 'none';
	GENFILTER.parentNode.style.display = 'none';

	if (window.external.FindSymbol("GENERATE_EXTENSION"))
	{
		var L_GENSERVEREXT_TEXT = "生成服务器扩展对象";
		GENSERVEREXT.innerText = L_GENSERVEREXT_TEXT;
		GENSERVEREXT.parentNode.style.display = 'block';

	}
	if (window.external.FindSymbol("GENERATE_FILTER"))
	{
		var L_GENFILTER_TEXT = "生成筛选对象";
		GENFILTER.innerText = L_GENFILTER_TEXT;
		GENFILTER.parentNode.style.display = 'block';
	}

	var L_USEMFCSHARED_TEXT = "在共享 DLL 中使用 MFC";
	var L_USEMFCSTATIC_TEXT = "在静态库中使用 MFC";
	if (window.external.FindSymbol("STATIC_MFC"))
		USEMFC.innerText = L_USEMFCSTATIC_TEXT;
	else
		USEMFC.innerText = L_USEMFCSHARED_TEXT;
}

function Next(document, linkto)
{
	window.external.Next(document, linkto);
}

function OnFinish(document)
{
	bValidating = true;
	if (!ValidateInput())
	{
		bValidating = false;
		Next(document, 'AppSettings.htm');
		return;
	}

	OnWizFinish(document);
}

function getval(obj, strProjName)
{
	var SymbolValue = "";
	switch(obj.NAME)
	{
		case "SAFE_PROJECT_NAME":
			SymbolValue	= CreateIdentifierSafeName(strProjName);
			break;
		case  "EXTENSION_CLASS":
			{
				var strSafeProjName = CreateIdentifierSafeName(strProjName);
				SymbolValue = "C" + strSafeProjName + "Extension"; 
			}
			break;
		case  "EXTENSION_DESC":
			SymbolValue = strProjName + " Extension"; 
			break;
		case  "FILTER_CLASS":
			{
				var strSafeProjName = CreateIdentifierSafeName(strProjName);
				SymbolValue = "C" + strSafeProjName + "Filter"; 
			}
			break;
		case  "FILTER_DESC":
			SymbolValue = strProjName + " Filter"; 
			break;
		case "ISAPI_SERVER":
			SymbolValue = "localhost";
			break;
		case "ISAPI_VROOT":
			SymbolValue = strProjName;
			break;
		case  "YEAR":
			{
				d = new Date();
				SymbolValue = d.getFullYear().toString();
			}
			break;
		default:
			SymbolValue = "";
			break;
	}
	return (SymbolValue);
}

function ValidateInput()
{
	var bValid = true;
	var strClass = window.external.FindSymbol("EXTENSION_CLASS");

	bValid = window.external.dte.VCLanguageManager.ValidateIdentifier(strClass) && 
		!window.external.dte.VCLanguageManager.IsReservedName(strClass);

	if (bValid)
	{
		strClass = window.external.FindSymbol("FILTER_CLASS");
		bValid = window.external.dte.VCLanguageManager.ValidateIdentifier(strClass) && 
			!window.external.dte.VCLanguageManager.IsReservedName(strClass);
	}

	if (!bValid)
	{
		window.external.ReportError();
		return false;
	}
	return true;
}

function OnClick(obj)
{
	if (obj.id == "Notifications")
	{
		if (window.external.FindSymbol("GENERATE_FILTER"))
		{ 
			Next(document, "Notifications.htm"); 
		}
	}
}
