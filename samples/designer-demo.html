<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>OpenMSE 设计器示例</title>
</head>
<body>
    <h1 id="heading" style="position:absolute;left:40px;top:30px;width:340px;height:36px;">OpenMSE 页面设计</h1>
    <label id="nameLabel" style="position:absolute;left:40px;top:100px;width:100px;height:30px;">姓名</label>
    <input id="nameInput" type="text" value="" style="position:absolute;left:150px;top:100px;width:250px;height:30px;">
    <label id="mailLabel" style="position:absolute;left:40px;top:150px;width:100px;height:30px;">电子邮件</label>
    <input id="mailInput" type="text" value="" style="position:absolute;left:150px;top:150px;width:250px;height:30px;">
    <input id="subscribe" type="checkbox" value="订阅更新" style="position:absolute;left:150px;top:200px;width:200px;height:30px;">
    <input id="submitButton" type="submit" value="提交" style="position:absolute;left:150px;top:260px;width:120px;height:36px;">
    <input id="resetButton" type="reset" value="重置" style="position:absolute;left:280px;top:260px;width:120px;height:36px;">
</body>
</html>
